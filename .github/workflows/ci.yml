name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: newsletter_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d newsletter_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run checks
        run: pnpm check
        env:
          DATABASE_URL: postgresql://postgres@localhost:5432/newsletter_test

      - name: Build minimal Nuxt consumer
        run: pnpm exec nuxt build test/fixtures/nuxt --logLevel=silent

      - name: Verify playground consumer
        run: |
          pnpm --dir playground typecheck
          pnpm --dir playground build

      - name: Verify basic example consumer
        run: |
          pnpm --dir examples/basic typecheck
          pnpm --dir examples/basic build

      - name: Smoke test both packed packages in clean consumers
        run: node scripts/smoke-pack.mjs
