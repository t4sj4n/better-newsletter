name: Publish release

on:
  workflow_dispatch:
    inputs:
      release_commit:
        description: Full SHA of the reviewed release commit on main
        required: true
        type: string
      dist_tag:
        description: npm dist-tag for both packages
        default: latest
        required: true
        type: string
      resume:
        description: Resume a partially completed publication
        default: false
        type: boolean
      artifact_run_id:
        description: Previous publish run ID to restore checked tarballs (optional for resume)
        required: false
        type: string

permissions:
  contents: write
  actions: read
  id-token: write

concurrency:
  group: npm-release-publication
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 't4sj4n/better-newsletter' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Validate dispatch inputs
        env:
          RELEASE_COMMIT: ${{ inputs.release_commit }}
          ARTIFACT_RUN_ID: ${{ inputs.artifact_run_id }}
          RESUME: ${{ inputs.resume }}
        run: |
          [[ "$RELEASE_COMMIT" =~ ^[0-9a-f]{40}$ ]] || { echo 'Provide a full lowercase release commit SHA'; exit 1; }
          [[ -z "$ARTIFACT_RUN_ID" || "$ARTIFACT_RUN_ID" =~ ^[0-9]+$ ]] || exit 1
          [[ -z "$ARTIFACT_RUN_ID" || "$RESUME" == 'true' ]] || { echo 'Artifact restoration requires resume'; exit 1; }

      - name: Check out release tooling from the dispatched main revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: release-tooling
          fetch-depth: 0

      - name: Check out the selected release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_commit }}
          path: release-source
          fetch-depth: 0

      - name: Verify selected commit belongs to main
        working-directory: release-source
        env:
          RELEASE_COMMIT: ${{ inputs.release_commit }}
        run: |
          test "$(git rev-parse HEAD)" = "$RELEASE_COMMIT"
          git fetch origin refs/heads/main:refs/remotes/origin/main
          git merge-base --is-ancestor HEAD origin/main
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.15.0

      - name: Install npm with trusted publishing support
        run: npm install --global npm@11.21.0

      - name: Install release tooling
        working-directory: release-tooling
        run: pnpm install --frozen-lockfile

      - name: Restore checked artifacts from a previous publish run
        if: inputs.resume && inputs.artifact_run_id != ''
        uses: actions/download-artifact@v4
        with:
          name: release-artifacts-${{ inputs.release_commit }}
          path: release-source/.git/newsletter-releases
          github-token: ${{ github.token }}
          run-id: ${{ inputs.artifact_run_id }}

      - name: Publish reviewed artifacts with release-it and npm OIDC
        working-directory: release-source
        env:
          DIST_TAG: ${{ inputs.dist_tag }}
          RESUME: ${{ inputs.resume }}
        run: |
          args=(--ci --tag "$DIST_TAG")
          if [[ "$RESUME" == 'true' ]]; then args+=(--resume); fi
          node "$GITHUB_WORKSPACE/release-tooling/scripts/release-publish.mjs" "${args[@]}"

      - name: Preserve artifacts for recovery
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts-${{ inputs.release_commit }}
          path: release-source/.git/newsletter-releases
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 30
